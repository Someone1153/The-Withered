        function formatDateTime(v) {
            if (!v) return '-';
            try {
                const d = new Date(v);
                if (!isNaN(d.getTime())) {
                    const pad = n => String(n).padStart(2, '0');
                    const day = pad(d.getDate());
                    const month = pad(d.getMonth() + 1);
                    const year = d.getFullYear();
                    const hours = pad(d.getHours());
                    const minutes = pad(d.getMinutes());
                    return `${day}/${month}/${year} ${hours}:${minutes}`;
                }
            } catch (e) {}
            const m = String(v).match(/(\d{1,2})\D(\d{1,2})\D(\d{2,4}).*(\d{1,2}):(\d{2})/);
            if (m) {
                const day = String(m[1]).padStart(2, '0');
                const month = String(m[2]).padStart(2, '0');
                const year = m[3].length === 2 ? ('20' + m[3]) : m[3];
                const hours = String(m[4]).padStart(2, '0');
                const minutes = String(m[5]).padStart(2, '0');
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            }
            return String(v);
        }

        function getDiscordCandidates(session) {
            const user = session?.user;
            if (!user) return [];

            const candidates = new Set();
            if (user.user_metadata?.provider_id) candidates.add(user.user_metadata.provider_id);
            if (user.user_metadata?.sub) candidates.add(user.user_metadata.sub);
            if (user.id) candidates.add(user.id);

            if (Array.isArray(user.identities)) {
                user.identities.forEach(identity => {
                    if (identity?.provider === 'discord' && identity?.identity_data?.id) {
                        candidates.add(identity.identity_data.id);
                    }
                    if (identity?.identity_data) {
                        Object.values(identity.identity_data).forEach(value => {
                            if (typeof value === 'string') candidates.add(value);
                        });
                    }
                });
            }

            return Array.from(candidates).filter(Boolean);
        }

        window.alternarPainelAdmin = function(painel) {
            const formularios = document.getElementById('colunas-formularios');
            const usuarios = document.getElementById('painel-usuarios-admin');
            const menuUsuarios = document.getElementById('menu-usuarios-admin');

            if (painel === 'usuarios') {
                formularios.style.display = 'none';
                usuarios.style.display = 'block';
                menuUsuarios.classList.add('ativo');
                carregarUsuariosAdmin();
                return;
            }

            formularios.style.display = 'grid';
            usuarios.style.display = 'none';
            menuUsuarios.classList.remove('ativo');
        };

        function renderUsuarioAdmin(usuario, online) {
            const nome = usuario.display_name || usuario.nome || 'Usuário';
            const avatar = usuario.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png';
            const ultimaAtividade = usuario.last_seen ? formatDateTime(usuario.last_seen) : 'Sem atividade registrada';
            return `
                <div class="usuario-admin-item">
                    <img src="${avatar}" alt="Avatar de ${nome}">
                    <div class="usuario-admin-dados">
                        <strong>${nome}</strong>
                        <span>${usuario.discord_id || usuario.user_id || '-'}</span>
                        <small>${online ? 'Online agora' : `Visto em ${ultimaAtividade}`}</small>
                    </div>
                    <span class="usuario-online-indicador ${online ? 'online' : ''}" title="${online ? 'Online agora' : 'Offline'}"></span>
                </div>
            `;
        }

        window.carregarUsuariosAdmin = async function() {
            const onlineContainer = document.getElementById('lista-usuarios-online');
            const todosContainer = document.getElementById('lista-todos-usuarios');
            if (!onlineContainer || !todosContainer) return;

            onlineContainer.innerHTML = '<p class="admin-loading">Carregando...</p>';
            todosContainer.innerHTML = '<p class="admin-loading">Carregando...</p>';

            const { data, error } = await supabaseClient
                .from(PRESENCA_TABELA)
                .select('*')
                .order('last_seen', { ascending: false });

            if (error) {
                console.error('Erro ao carregar usuários:', error);
                onlineContainer.innerHTML = '<p class="admin-error">Não foi possível carregar os usuários.</p>';
                todosContainer.innerHTML = '';
                return;
            }

            const limiteOnline = Date.now() - 2 * 60 * 1000;
            const usuarios = Array.isArray(data) ? data : [];
            const online = usuarios.filter(usuario => new Date(usuario.last_seen).getTime() >= limiteOnline);

            onlineContainer.innerHTML = online.length
                ? online.map(usuario => renderUsuarioAdmin(usuario, true)).join('')
                : '<p class="texto-vazio">Ninguém online no momento.</p>';
            todosContainer.innerHTML = usuarios.length
                ? usuarios.map(usuario => renderUsuarioAdmin(usuario, online.includes(usuario))).join('')
                : '<p class="texto-vazio">Nenhum usuário registrado.</p>';
        };

        function switchId(tipo) {
            return `switch-${formularioTipos[tipo]}`;
        }

        async function carregarEstadosFormularios() {
            const { data, error } = await supabaseClient
                .from('config_formularios')
                .select('tipo, aberto');

            if (error) {
                console.error('Erro ao carregar estados dos formulários:', error);
                return;
            }

            (data || []).forEach(item => {
                const tipo = Object.keys(formularioTipos).find(chave => formularioTipos[chave] === item.tipo);
                if (tipo) estadosFormularios[tipo] = item.aberto !== false;
            });

            Object.keys(formularioTipos).forEach(tipo => {
                const input = document.getElementById(switchId(tipo));
                if (input) input.checked = estadosFormularios[tipo];
            });
        }

        let confirmacaoPendente = null;

        window.confirmarEstadoFormulario = function(tipo, input) {
            const novoEstado = input.checked;
            input.checked = estadosFormularios[tipo];
            confirmacaoPendente = { tipo, novoEstado, input };

            document.getElementById('modal-confirmacao-titulo').textContent = novoEstado
                ? `Abrir formulário de ${tipo}`
                : `Fechar formulário de ${tipo}`;
            document.getElementById('modal-confirmacao-texto').textContent = novoEstado
                ? 'Os usuários poderão acessar e responder este formulário.'
                : 'Os usuários não poderão acessar ou responder este formulário enquanto ele estiver fechado.';
            document.getElementById('modal-confirmacao-formulario').classList.add('modal-aberto');
            document.getElementById('modal-confirmacao-formulario').setAttribute('aria-hidden', 'false');

            document.getElementById('confirmar-estado-formulario-btn').onclick = salvarEstadoFormulario;
        };

        window.fecharConfirmacaoFormulario = function() {
            if (confirmacaoPendente?.input) confirmacaoPendente.input.checked = estadosFormularios[confirmacaoPendente.tipo];
            confirmacaoPendente = null;
            const modal = document.getElementById('modal-confirmacao-formulario');
            modal.classList.remove('modal-aberto');
            modal.setAttribute('aria-hidden', 'true');
        };

        async function salvarEstadoFormulario() {
            if (!confirmacaoPendente) return;
            const { tipo, novoEstado, input } = confirmacaoPendente;
            const botao = document.getElementById('confirmar-estado-formulario-btn');
            botao.disabled = true;

            const { error } = await supabaseClient
                .from('config_formularios')
                .upsert({ tipo: formularioTipos[tipo], aberto: novoEstado }, { onConflict: 'tipo' });

            botao.disabled = false;
            if (error) {
                console.error('Erro ao salvar estado do formulário:', error);
                alert(`Não foi possível alterar este formulário: ${error.message}`);
                fecharConfirmacaoFormulario();
                return;
            }

            estadosFormularios[tipo] = novoEstado;
            input.checked = novoEstado;
            confirmacaoPendente = null;
            fecharConfirmacaoFormulario();
        }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (!session || !session.user) {

        async function salvarDecisaoAdmin(form) {
            const status = document.getElementById('admin-status-formulario')?.value;
            const comentario = document.getElementById('admin-comentario-formulario')?.value.trim() || '';
            const mensagem = document.getElementById('admin-decisao-mensagem');

            if (!form.__table || !form.id || !status) {
                if (mensagem) mensagem.textContent = 'Não foi possível identificar este formulário.';
                return;
            }

            const botao = document.getElementById('admin-decisao-final-btn');
            if (botao) botao.disabled = true;
            if (mensagem) mensagem.textContent = 'Salvando decisão...';

            const { data: updatedRows, error } = await supabaseClient
                .from(form.__table)
                .update({
                    status,
                    comentario_admin: comentario,
                    decisao_final: true,
                    resposta_final_enviada: false
                })
                .eq('id', form.id)
                .select('id, status, comentario_admin, decisao_final, resposta_final_enviada');

            if (botao) botao.disabled = false;
            if (error) {
                console.error('Erro ao salvar decisão do formulário:', error);
                if (mensagem) mensagem.textContent = `Erro ao salvar: ${error.message}`;
                return;
            }

            if (!updatedRows || updatedRows.length === 0) {
                console.error('Update sem linhas alteradas:', {
                    tabela: form.__table,
                    id: form.id,
                    status,
                    motivo: 'O registro foi lido, mas a política RLS pode estar bloqueando UPDATE.'
                });
                if (mensagem) mensagem.textContent = 'O formulário foi lido, mas o Supabase bloqueou a atualização. Crie uma política RLS de UPDATE para admins.';
                return;
            }

            Object.assign(form, updatedRows[0]);
            if (mensagem) mensagem.textContent = 'Decisão final salva com sucesso.';
            await carregarFormularios();
        }

        window.enviarRespostasFinais = async function(table) {
            const botao = document.querySelector(`[onclick="enviarRespostasFinais('${table}')"]`);
            if (botao) botao.disabled = true;

            const { data: pendentes, error: buscaError } = await supabaseClient
                .from(table)
                .select('id, decisao_final, resposta_final_enviada')
                .eq('decisao_final', true);

            if (buscaError) {
                if (botao) botao.disabled = false;
                console.error('Erro ao buscar decisões finais:', buscaError);
                alert(`Erro ao buscar respostas: ${buscaError.message}`);
                return;
            }

            const registrosPendentes = (pendentes || []).filter(item => item.resposta_final_enviada !== true);
            let enviados = 0;
            for (const registro of registrosPendentes) {
                const { data: atualizados, error } = await supabaseClient
                    .from(table)
                    .update({ resposta_final_enviada: true })
                    .eq('id', registro.id)
                    .select('id');

                if (error) {
                    if (botao) botao.disabled = false;
                    console.error('Erro ao publicar resposta final:', error);
                    alert(`Erro ao enviar respostas finais: ${error.message}`);
                    return;
                }
                if (atualizados && atualizados.length > 0) enviados += 1;
            }

            if (botao) botao.disabled = false;
            await carregarFormularios();
            alert(enviados > 0
                ? `${enviados} resposta(s) final(is) enviada(s) aos usuários.`
                : 'Nenhuma decisão final pendente para enviar.');
        };

        function getStatusClassAdmin(status) {
            if (status === 'Aprovado') return 'status-aprovado';
            if (status === 'Recusado') return 'status-reprovado';
            return 'status-em-analise';
        }

        function valorVerdadeiro(value) {
            return value === true || value === 'true' || value === 1 || value === '1';
        }

        window.fecharModalAdmin = function() {
            const modal = document.getElementById('modal-admin-form');
            if (!modal) return;
            modal.classList.remove('modal-aberto');
        }

        async function carregarFormularios() {
            const listaPlayers = document.getElementById('lista-players');
            const listaStaff = document.getElementById('lista-staff');
            const listaCriancas = document.getElementById('lista-criancas');

            listaPlayers.innerHTML = '<p class="admin-loading">Carregando...</p>';
            listaStaff.innerHTML = '<p class="admin-loading">Carregando...</p>';
            listaCriancas.innerHTML = '<p class="admin-loading">Carregando...</p>';

            let playersData = [];
            let staffData = [];
            let criancasData = [];
            let playersError = null;
            let staffError = null;
            let criancasError = null;

            try {
                const playersResult = await supabaseClient
                    .from('formulario_players')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (playersResult.error) {
                    playersError = playersResult.error;
                    console.error('Erro ao buscar formulários de Players no Supabase:', playersResult.error);
                } else {
                    playersData = Array.isArray(playersResult.data) ? playersResult.data : [];
                }
            } catch (err) {
                playersError = err;
                console.error('Erro inesperado ao buscar formularios de Players:', err);
            }

            try {
                const staffResult = await supabaseClient
                    .from('formulario_staff')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (staffResult.error) {
                    staffError = staffResult.error;
                    console.error('Erro ao buscar formulários de Staff no Supabase:', staffResult.error);
                } else {
                    staffData = Array.isArray(staffResult.data) ? staffResult.data : [];
                }
            } catch (err) {
                staffError = err;
                console.error('Erro inesperado ao buscar formularios de Staff:', err);
            }

            try {
                const criancasResult = await supabaseClient
                    .from('formulario_criancas')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (criancasResult.error) {
                    criancasError = criancasResult.error;
                    console.error('Erro ao buscar formulários de Crianças no Supabase:', criancasResult.error);
                } else {
                    criancasData = Array.isArray(criancasResult.data) ? criancasResult.data : [];
                }
            } catch (err) {
                criancasError = err;
                console.error('Erro inesperado ao buscar formularios de Crianças:', err);
            }

            const players = [];
            const staff = [];
            const criancas = [];

            playersData.forEach(item => {
                item.__table = 'formulario_players';
                const tipo = (item.tipo || '').toString().toLowerCase();
                if (tipo.includes('staff')) staff.push(item);
                else if (tipo.includes('crian')) criancas.push(item);
                else players.push(item);
            });

            // Adiciona os registros de formulario_staff diretamente na lista de Staff.
            staff.push(...staffData.map(item => ({ ...item, __table: 'formulario_staff' })));

            // Adiciona os registros de formulario_criancas diretamente na lista de Crianças.
            criancas.push(...criancasData.map(item => ({ ...item, __table: 'formulario_criancas' })));

            function renderList(container, items) {
                if (!container) return;
                if (!items || items.length === 0) {
                    container.innerHTML = '<p class="texto-vazio">Nenhum formulário nesta categoria.</p>';
                    return;
                }

                container.innerHTML = '';
                items.forEach((form, idx) => {
                    const numero = idx + 1;
                    const dataEnvio = formatDateTime(form.created_at || form.enviadoEm) || 'Data não informada';
                    const nome = form.nome_apelido || form.tag || 'Sem nome';
                    const decisaoSalva = valorVerdadeiro(form.decisao_final);
                    const statusIndicador = decisaoSalva ? (form.status || 'Em análise') : 'Em análise';
                    const indicadorClasse = statusIndicador === 'Aprovado'
                        ? 'admin-indicador-aprovado'
                        : statusIndicador === 'Recusado'
                            ? 'admin-indicador-recusado'
                            : 'admin-indicador-analise';

                    const row = document.createElement('div');
                    row.className = `admin-compact-row${decisaoSalva ? ' admin-row-decisao-salva' : ''}`;
                    row.innerHTML = `
                        <span style="min-width:30px; font-weight:700; color:#c8d2ff">${numero}</span>
                        <span style="flex:1; font-weight:600; color:#fff; overflow:hidden; text-overflow:ellipsis; padding-right:10px;">${nome}</span>
                        <span style="color:#a3a3a3; font-size:0.85rem; white-space:nowrap;">${dataEnvio}</span>
                        <span class="admin-leitura-indicador ${indicadorClasse}" title="${decisaoSalva ? `Decisão salva: ${statusIndicador}` : 'Ainda não lido'}" aria-label="${decisaoSalva ? `Decisão salva: ${statusIndicador}` : 'Ainda não lido'}"></span>
                    `;
                    row.addEventListener('click', () => abrirModalAdmin(form));
                    container.appendChild(row);
                });
            }

            if (playersError && players.length === 0) {
                listaPlayers.innerHTML = '<p class="admin-error">Erro ao carregar formulários de Players. Tente novamente mais tarde.</p>';
            } else {
                renderList(listaPlayers, players);
            }

            if (staffError && staff.length === 0) {
                listaStaff.innerHTML = '<p class="admin-error">Erro ao carregar formulários de Staff. Tente novamente mais tarde.</p>';
            } else {
                renderList(listaStaff, staff);
            }

            if (criancasError && criancas.length === 0) {
                listaCriancas.innerHTML = '<p class="admin-error">Erro ao carregar formulários de Crianças. Tente novamente mais tarde.</p>';
            } else {
                renderList(listaCriancas, criancas);
            }
        }
    </script>
